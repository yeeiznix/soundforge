name: G6 APK Preview Build

on:
  workflow_dispatch:
    inputs:
      native_only:
        description: 'Build native NDK only (skip Kotlin/APK). Proves the CMake repair on x86_64 NDK without touching the frozen Kotlin layer.'
        type: boolean
        default: false

jobs:
  build:
    name: Build APK (repair branch head)
    runs-on: ubuntu-latest
    
    steps:
      - name: Verify runner architecture
        run: |
          echo "Runner: $(uname -m)"
          uname -m | grep -qE "x86_64|amd64" || (echo "ERROR: Runner is not x86_64" && exit 1)

      - name: Checkout repair branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checkout is run head
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "GITHUB_SHA: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "ERROR: checkout mismatch"; exit 1; }

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Locate preinstalled Android cmdline-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" 2>&1 || true
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          test -n "$SDKM" || { echo "ERROR: no sdkmanager found"; exit 1; }
          echo "SDKM=$SDKM" >> "$GITHUB_ENV"
          "$SDKM" --version

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          true

      - name: Install Android platform API 34
        run: |
          yes | "$SDKM" "platforms;android-34" >/dev/null 2>&1 || { echo "platform 34 install failed"; exit 1; }

      - name: Install Android build-tools 34.0.0
        run: |
          yes | "$SDKM" "build-tools;34.0.0" >/dev/null 2>&1 || { echo "build-tools install failed"; exit 1; }

      - name: Install Android NDK (AGP 8.2 default)
        run: |
          yes | "$SDKM" "ndk;25.1.8937393" >/dev/null 2>&1 || { echo "NDK install failed"; exit 1; }

      - name: Install CMake 3.22.1
        run: |
          yes | "$SDKM" "cmake;3.22.1" >/dev/null 2>&1 || { echo "CMake install failed"; exit 1; }

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build native NDK only (x86_64, debug, no Kotlin)
        if: inputs.native_only == 'true'
        run: |
          set -o pipefail
          mkdir -p /tmp/opencode
          ./gradlew :app:buildCMakeDebug \
            -Pandroid.useAndroidX=true \
            --console=plain 2>&1 | tee /tmp/opencode/native-build.log || \
          ./gradlew :app:externalNativeBuildDebug \
            -Pandroid.useAndroidX=true \
            --console=plain 2>&1 | tee /tmp/opencode/native-build.log
          echo "native_log=/tmp/opencode/native-build.log" >> $GITHUB_ENV

      - name: Locate native library (native-only)
        if: inputs.native_only == 'true'
        id: find_native
        run: |
          SO_PATH=$(find app/build -type f -name "libsfcore.so" | head -1)
          if [ -z "$SO_PATH" ]; then
            echo "ERROR: no libsfcore.so produced"
            find app/build -type f -name "*.so" || true
            exit 1
          fi
          echo "so_path=$SO_PATH" >> $GITHUB_OUTPUT
          echo "Found native lib: $SO_PATH"

      - name: Verify native library (native-only)
        if: inputs.native_only == 'true'
        run: |
          SO_PATH="${{ steps.find_native.outputs.so_path }}"
          ls -lh "$SO_PATH"
          SIZE=$(stat -c%s "$SO_PATH")
          if [ "$SIZE" -eq 0 ]; then
            echo "ERROR: lib is 0 bytes"
            exit 1
          fi
          echo "LIB size: $SIZE bytes"
          echo "SHA-256:"
          sha256sum "$SO_PATH"

      - name: Upload native library artifact (native-only)
        if: inputs.native_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libsfcore-g6-debug
          path: ${{ steps.find_native.outputs.so_path }}
          retention-days: 30

      - name: Build APK (assembleDebug with AndroidX property)
        if: inputs.native_only != 'true'
        run: |
          ./gradlew :app:assembleDebug \
            -Pandroid.useAndroidX=true \
            --console=plain

      - name: Find APK
        if: inputs.native_only != 'true'
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs -type f -name "*debug*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Verify APK
        if: inputs.native_only != 'true'
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          ls -lh "$APK_PATH"
          SIZE=$(stat -c%s "$APK_PATH")
          if [ "$SIZE" -eq 0 ]; then
            echo "ERROR: APK is 0 bytes"
            exit 1
          fi
          echo "APK size: $SIZE bytes"
          echo "SHA-256:"
          sha256sum "$APK_PATH"

      - name: Upload APK artifact
        if: success() && inputs.native_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SoundForge-G6-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SoundForge-G6-build-logs
          path: |
            app/build/outputs/
            build/
          retention-days: 7

      - name: Final summary
        if: success()
        run: |
          echo "=== BUILD SUCCESSFUL ==="
          echo "Mode: native_only=${{ inputs.native_only }}"
          echo "APK: ${{ steps.find_apk.outputs.apk_path }}"
          echo "Artifact: SoundForge-G6-debug or libsfcore-g6-debug"
