name: G6 APK Preview Build

on:
  workflow_dispatch

jobs:
  build:
    name: Build APK (G6 frozen d92b7ae)
    runs-on: ubuntu-latest
    
    steps:
      - name: Verify runner architecture
        run: |
          echo "Runner: $(uname -m)"
          uname -m | grep -qE "x86_64|amd64" || (echo "ERROR: Runner is not x86_64" && exit 1)

      - name: Checkout exact G6 commit d92b7ae
        uses: actions/checkout@v4
        with:
          ref: d92b7ae
          fetch-depth: 0

      - name: Verify checkout
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "Expected: d92b7aeb1aad51873f2b9a3e33bb7da3f75bc27f"
          git rev-parse HEAD | grep -q "d92b7ae" || exit 1
          echo "Tag on HEAD:"
          git describe --tags --exact-match HEAD || echo "(no exact tag)"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform API 34
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34"

      - name: Install Android build-tools 34.0.0
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"

      - name: Install Android NDK (default for AGP 8.2)
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"

      - name: Install CMake 3.22.1
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      - name: Accept Android SDK licenses
        run: |
          echo -e "\n\ny\n" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (assembleDebug with AndroidX property)
        run: |
          ./gradlew :app:assembleDebug \
            -Pandroid.useAndroidX=true \
            --console=plain

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs -type f -name "*debug*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Verify APK
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          ls -lh "$APK_PATH"
          SIZE=$(stat -c%s "$APK_PATH")
          if [ "$SIZE" -eq 0 ]; then
            echo "ERROR: APK is 0 bytes"
            exit 1
          fi
          echo "APK size: $SIZE bytes"
          echo "SHA-256:"
          sha256sum "$APK_PATH"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoundForge-G6-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SoundForge-G6-build-logs
          path: |
            app/build/outputs/
            build/
          retention-days: 7

      - name: Final summary
        if: success()
        run: |
          echo "=== BUILD SUCCESSFUL ==="
          echo "APK: ${{ steps.find_apk.outputs.apk_path }}"
          echo "Artifact: SoundForge-G6-debug"
